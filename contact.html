
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - CSE Department</title>
</head>
<body>
    <h1>Contact the CSE Department</h1>

    <p>University: SR University</p>
    <p>Department: Computer Science and Engineering</p>
    <p>Location: Warangal, Telangana, India</p>

    <h2>Send an Enquiry</h2>
    <form>
        <label for="name">Name:</label>
        <input id="name" type="text" required>
        <br><br>

        <label for="email">Email:</label>
        <input id="email" type="email" required>
        <br><br>

        <label for="message">Message:</label>
        <textarea id="message" required></textarea>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p><a href="index.html">Back to Main Website</a></p>
</body>
</html>
